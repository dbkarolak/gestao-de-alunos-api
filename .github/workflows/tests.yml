name: Testes de API

on:
  push:
    branches: [development]
  pull_request:
    branches: [production]
  workflow_dispatch:

jobs:
  testes:
    name: Mocha, SuperTest e Chai
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar o .env a partir do .env.example
        run: cp .env.example .env

      - name: Subir a API em segundo plano
        run: |
          npm start > api.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "A API não subiu:"; cat api.log; exit 1

      - name: Executar os testes
        run: npm test

      - name: Log da API em caso de falha
        if: failure()
        run: cat api.log